<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}BiblioTech{% endblock %}</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; }
        header {
            background: #2c3e50;
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav a {
            color: white;
            margin: 0 15px;
            text-decoration: none;
        }
        nav a:hover { text-decoration: underline; }
        .container { padding: 40px; }
    </style>
</head>
<body>
    <header>
        <h2><a href="/" style="color:white; text-decoration:none;">📚 BiblioTech</a></h2>
        <nav>
            <a href="/">Strona główna</a>
            <a href="/katalog/">Katalog</a>
            {% if user.is_authenticated %}
                <span>Witaj, {{ user.username }}!</span>
                <form method="post" action="{% url 'logout' %}" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="background:none; border:none; color:white; cursor:pointer; text-decoration:underline;">Wyloguj się</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Zaloguj się</a>
                <a href="{% url 'register' %}">Zarejestruj się</a>
            {% endif %}
        </nav>
    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
