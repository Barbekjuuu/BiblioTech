{% load static %}
<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>{% block title %}BiblioTech{% endblock %}</title>
    
    <!-- Główny plik CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
    
    <style>
        /* Dodatkowe style inline - nadpisują CSS jeśli potrzeba */
    </style>
</head>
<body>
    <header>
        <h2><a href="/" style="color:white; text-decoration:none;">📚 BiblioTech</a></h2>
        <nav>
            <a href="/">Strona główna</a>
            <a href="/katalog/">Katalog</a>
            {% if user.is_authenticated %}
                <a href="{% url 'moje_rezerwacje' %}">Moje rezerwacje</a>
                <span>Witaj, {{ user.username }}!</span>
                <a href="{% url 'logout' %}">Wyloguj się</a>
            {% else %}
                <a href="{% url 'login' %}">Zaloguj się</a>
                <a href="{% url 'register' %}">Zarejestruj się</a>
            {% endif %}
        </nav>
    </header>

    <div class="container">
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
