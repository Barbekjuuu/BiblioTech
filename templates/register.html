{% extends 'base.html' %}

{% block title %}Rejestracja - BiblioTech{% endblock %}

{% block content %}
    <h1>Założ konto</h1>
    
    {% if messages %}
        {% for message in messages %}
            <p style="color:green;">{{ message }}</p>
        {% endfor %}
    {% endif %}

    <form method="post" style="max-width:400px;">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" style="padding:10px 20px; font-size:16px;">Zarejestruj się</button>
    </form>
    
    <p>Masz już konto? <a href="{% url 'login' %}">Zaloguj się</a></p>
{% endblock %}
